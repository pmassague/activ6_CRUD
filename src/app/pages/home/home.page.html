<section class="container mt-4">
  @if(response.isLoading())
  {
    <p>Cargando...</p>
    }@else if( response.error()){
    <p>No hay resultados</p>
    }@else{
    <div class="row g-4">
        @for(user of response.value()?.results; track user._id){ 
        <article class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-3 ">
              <app-user-card [myUser]="user"></app-user-card>
        </article>
    }
  </div>
}
</section>
