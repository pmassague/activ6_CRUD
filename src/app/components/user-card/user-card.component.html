<div class="card shadow-sm border-1 p-3 text-center pointer-card h-100">
  
  <div class="position-relative mb-3">
    <img 
      [src]="myUser()?.image" 
      alt="Imagen de {{ myUser()?.first_name }}" 
      class="rounded-circle mx-auto img-fluid shadow-sm object-fit-cover" 
      style="width: 100px; height: 100px;"
    >
  </div>

  <div class="mb-4 flex-grow-1">
    <h5 class="card-title mb-1 fw-bold text-dark">
      {{ myUser()?.first_name }} {{ myUser()?.last_name }}
    </h5>
  </div>

  <hr class="text-muted opacity-25 mt-0">


  <div class="row g-2 justify-content-center">
  
  <!-- Botón Ver Detalle -->
  <div class="col-4">
    <button 
      [routerLink]="['/user', myUser()?._id]" 
      class="btn btn-sm w-100 d-flex flex-column align-items-center py-2 btn-custom-action"
      title="Ver detalles"
    >
      <!-- Icono -->
      <i class="bi bi-search mb-1 fs-5 text-dark"></i>
      <span class="btn-text-xs">Ver detalle</span>
    </button>
  </div>

  <!-- Botón Actualizar -->
  <div class="col-4">
    <button 
      [routerLink]="['/updateuser', myUser()?._id]" 
      class="btn btn-sm w-100 d-flex flex-column align-items-center py-2 btn-custom-action"
      title="Actualizar usuario"
    >
      <!-- Icono -->
      <i class="bi bi-arrow-repeat mb-1 fs-5 text-dark"></i>
      <span class="btn-text-xs">Actualizar</span>
    </button>
  </div>

  <!-- Botón Borrar-->
  <div class="col-4">
    <button
      class="btn btn-sm w-100 d-flex flex-column align-items-center py-2 btn-custom-action"
      title="Borrar usuario"
      (click)="onDelete(myUser()?._id)"
    >
      <!-- Icono -->
      <i class="bi bi-trash mb-1 fs-5 text-dark"></i>
      <span class="btn-text-xs">Borrar</span>
    </button>
  </div>

</div>
</div>
